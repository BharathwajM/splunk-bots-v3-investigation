title: S3 Bucket ACL Grants Access to Everyone
id: 78d390da-8048-4e26-a57e-481d74502a75
status: experimental
description: |
    PutBucketAcl with a grant to the AllUsers or AuthenticatedUsers group, which makes the bucket
    public. In BOTS v3 an outside IP wrote a file to the bucket 58 seconds after it was opened.
    Sigma version of detections/splunk/D12-s3-bucket-opened-to-everyone.spl.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/acl-overview.html
author: Bharathwaj Murali
date: 2026-11-10
tags:
    - attack.collection
    - attack.t1530
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: s3.amazonaws.com
        eventName: PutBucketAcl
    selection_grantee:
        requestParameters|contains:
            - 'groups/global/AllUsers'
            - 'groups/global/AuthenticatedUsers'
    condition: all of selection*
falsepositives:
    - A bucket that is meant to host a public website. Those should be listed and excluded
level: high
