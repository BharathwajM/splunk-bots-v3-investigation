title: Local Account Created or Added to Administrators From the Command Line
id: f06ed72d-dcef-4a08-83e5-3c77e4391cef
status: experimental
description: |
    net user /add or net localgroup administrators /add. Attackers create a local admin account
    as a backdoor that survives a password reset of the compromised user.
    Sigma version of detections/splunk/D06-local-account-added-to-administrators.spl.
references:
    - https://attack.mitre.org/techniques/T1136/001/
    - https://attack.mitre.org/techniques/T1098/
author: Bharathwaj Murali
date: 2026-11-10
tags:
    - attack.persistence
    - attack.t1136.001
    - attack.t1098
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_user_add:
        CommandLine|contains|all:
            - ' user '
            - '/add'
    selection_admin_add:
        CommandLine|contains|all:
            - ' localgroup '
            - 'administrators'
            - '/add'
    condition: selection_image and 1 of selection_*_add
falsepositives:
    - IT staff or provisioning scripts creating local accounts. Check who ran it and whether a ticket exists
level: medium
