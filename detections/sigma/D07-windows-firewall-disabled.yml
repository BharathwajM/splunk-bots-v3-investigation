title: Windows Firewall Turned Off With netsh
id: 32bcd623-81a4-4bd6-b54c-3101a67b850b
status: experimental
description: |
    netsh advfirewall set ... state off, or the older netsh firewall set opmode disable.
    In BOTS v3 the attacker did this on FYODOR-L before downloading tools.
    Sigma version of detections/splunk/D07-windows-firewall-disabled.spl.
references:
    - https://attack.mitre.org/techniques/T1562/004/
author: Bharathwaj Murali
date: 2026-11-10
tags:
    - attack.t1562.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\netsh.exe'
    selection_advfirewall:
        CommandLine|contains|all:
            - 'advfirewall'
            - ' set '
            - ' state off'
    selection_legacy:
        CommandLine|contains|all:
            - ' firewall '
            - ' opmode '
            - 'disable'
    condition: selection_image and (selection_advfirewall or selection_legacy)
falsepositives:
    - Troubleshooting by an administrator
level: high
